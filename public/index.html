<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS — Agent Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
  :root{
    --bg:#f3f2ef; --panel:#ffffff; --ink:#15171a; --ink-dim:#6b6f76;
    --line:#e3e1dc; --accent:#c6372f; --accent-soft:#f6e4e2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;}
  body{font-family:'Inter',sans-serif;color:var(--ink);}
  .stage-outer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);}
  .stage{
    width:1280px;height:800px;flex:none;
    background:var(--panel);
    display:flex;flex-direction:column;
    overflow:hidden;position:relative;
    box-shadow:0 40px 90px -30px rgba(20,18,15,.25);
  }

  /* ---------- topbar ---------- */
  .topbar{display:flex;align-items:center;padding:22px 34px 0;flex:none;}
  .brand{font-weight:800;letter-spacing:3px;font-size:14px;}
  .brand .dot{color:var(--accent);}
  .nav{margin-left:auto;display:flex;gap:28px;font-size:11px;letter-spacing:1.5px;color:var(--ink-dim);}
  .nav span{cursor:pointer;}
  .nav span:hover{color:var(--ink);}

  /* ---------- hero ---------- */
  .hero{flex:1;min-height:0;position:relative;display:flex;}
  .hero-vert{position:absolute;left:14px;top:60px;bottom:120px;display:flex;align-items:flex-end;}
  .hero-vert span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:4px;color:var(--ink-dim);}

  .hero-barcode{position:absolute;left:36px;top:60px;width:14px;height:90px;
    background:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 4px,#000 4px 5px,transparent 5px 9px);}

  .hero-text{position:absolute;left:70px;top:90px;z-index:2;}
  .hero-text h1{margin:0;font-size:68px;line-height:.92;font-weight:800;letter-spacing:1px;}
  .hero-text .sub{margin-top:18px;font-size:11px;letter-spacing:2px;color:var(--ink-dim);max-width:280px;line-height:1.7;}
  .hero-cta{margin-top:26px;display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:1.5px;color:var(--accent);cursor:pointer;}
  .hero-cta .arrow{width:26px;height:26px;border:1px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;}

  .callout{position:absolute;right:360px;top:70px;z-index:2;font-size:10.5px;color:var(--ink-dim);line-height:1.5;text-align:right;}
  .callout .dot-line{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-bottom:6px;}
  .callout .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
  .callout .line{width:40px;height:1px;background:var(--line);}

  .char-wrap{position:absolute;right:0;top:0;bottom:0;width:640px;}
  .char-wrap canvas{display:block;width:100%;height:100%;}
  .char-floor{position:absolute;left:0;right:0;bottom:0;height:160px;
    background:linear-gradient(to bottom, rgba(243,242,239,0) 0%, var(--bg) 92%);pointer-events:none;}

  .status-chips{position:absolute;left:70px;bottom:120px;display:flex;gap:18px;z-index:2;}
  .chip{font-size:10px;letter-spacing:.5px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;}
  .chip .led{width:6px;height:6px;border-radius:50%;background:#2f9e5c;}
  .chip b{color:var(--ink);font-weight:600;}

  /* ---------- talk bar ---------- */
  .talkbar{flex:none;padding:18px 34px 26px;display:flex;justify-content:center;}
  .talkbar-inner{width:760px;display:flex;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--line);border-radius:28px;
    padding:8px 8px 8px 20px;box-shadow:0 10px 30px -14px rgba(20,18,15,.18);}
  .talkbar input{flex:1;border:none;outline:none;background:transparent;font:400 14px/1.4 'Inter',sans-serif;color:var(--ink);}
  .talkbar input::placeholder{color:#a7a39b;}
  .mic-btn,.send-btn{border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .mic-btn{background:var(--accent-soft);color:var(--accent);font-size:15px;}
  .mic-btn.listening{background:var(--accent);color:#fff;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  .send-btn{background:var(--ink);color:#fff;font-size:14px;}
  .send-btn:hover{background:#000;}

  .toast{position:absolute;left:50%;bottom:108px;transform:translate(-50%,8px);
    background:var(--ink);color:#fff;font-size:12px;letter-spacing:.3px;
    padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;z-index:5;white-space:nowrap;}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (prefers-reduced-motion:reduce){ * { animation:none !important; } }
</style>
</head>
<body>

<div class="stage-outer">
  <div class="stage" id="stage">

    <div class="topbar">
      <div class="brand">N<span class="dot">•</span>EXUS</div>
      <div class="nav">
        <span id="nav-proses">PROSES</span>
        <span id="nav-tentang">TENTANG</span>
        <span id="nav-pengaturan">PENGATURAN</span>
      </div>
    </div>

    <div class="hero">
      <div class="hero-vert"><span>SELAMAT DATANG</span></div>
      <div class="hero-barcode"></div>

      <div class="hero-text">
        <h1>AGENT<br>KERJA</h1>
        <div class="sub">Satu entitas yang bisa diajak bicara — bukan kotak teks kosong — untuk mengerjakan semua urusanmu di latar belakang.</div>
        <div class="hero-cta"><span class="arrow">→</span> MULAI NGOBROL</div>
      </div>

      <div class="callout">
        <div class="dot-line"><span class="line"></span><span class="dot"></span></div>
        siap diajak bicara<br>kapan saja
      </div>

      <div class="char-wrap">
        <canvas id="char-canvas" width="640" height="800"></canvas>
      </div>
      <div class="char-floor"></div>

      <div class="status-chips">
        <div class="chip"><span class="led"></span> <b id="chip-status">SIAP</b></div>
        <div class="chip"><span class="led" style="background:#a7a39b;"></span> 0 TUGAS AKTIF</div>
      </div>
    </div>

    <div class="talkbar">
      <div class="talkbar-inner">
        <span class="mic-btn" id="btn-mic">🎙</span>
        <input id="input-text" type="text" placeholder="Ketik perintah, atau tekan mic untuk bicara…">
        <span class="send-btn" id="btn-send">➤</span>
      </div>
    </div>

    <div class="toast" id="toast"></div>

  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "./vendor/three/jsm/loaders/GLTFLoader.js";
import { KTX2Loader } from "./vendor/three/jsm/loaders/KTX2Loader.js";
import { MeshoptDecoder } from "./vendor/three/jsm/libs/meshopt_decoder.module.js";
(function(){
  "use strict";
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- viewport fit ----------
  var stage = document.getElementById("stage");
  function fit(){
    var s = Math.min(window.innerWidth/1280, window.innerHeight/800);
    stage.style.transform = "scale(" + s + ")";
  }
  fit();
  window.addEventListener("resize", fit);

  // ---------- rAF gate, ~30fps, pause off-screen ----------
  function gate(cv, draw){
    var raf = 0, vis = false, alive = true, last = 0;
    function tick(now){
      raf = 0;
      if (!alive || !vis) return;
      if (now - last >= 33){ last = now; draw(now); }
      raf = requestAnimationFrame(tick);
    }
    var io = new IntersectionObserver(function(entries){
      vis = entries[0].isIntersecting;
      if (vis && !raf) raf = requestAnimationFrame(tick);
    });
    io.observe(cv);
    return function(){ alive = false; io.disconnect(); cancelAnimationFrame(raf); };
  }

  // ---------- rigged 3D character (glTF, ARKit blendshapes) ----------
  function initCharacter(cv, props){
    var rect = cv.parentElement.getBoundingClientRect();
    var W = Math.round(rect.width) || props.w, H = Math.round(rect.height) || props.h;
    cv.width = W; cv.height = H;
    var renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
    renderer.setSize(W, H, false);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(26, W/H, 0.1, 100);

    var key = new THREE.DirectionalLight(0xffffff, 2.3);
    key.position.set(-0.5, 0.7, 1);
    scene.add(key);
    var rim = new THREE.PointLight(0xdfe7ff, 14, 20, 2);
    rim.position.set(1.4, 0.4, -0.5);
    scene.add(rim);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xcfcac0, 0.7));

    var group = new THREE.Group();
    scene.add(group);

    var t0 = performance.now(), stop = function(){};
    var mouse = { x:0, y:0 };
    var talking = false, talkEnergy = 0, wordKick = 0;
    var blinkAt = reduceMotion ? 1e9 : (2 + Math.random()*3);
    var head = null, dict = null, infl = null;

    var ktx2 = new KTX2Loader();
    ktx2.setTranscoderPath("./vendor/three/jsm/libs/basis/");
    ktx2.detectSupport(renderer);
    var loader = new GLTFLoader();
    loader.setKTX2Loader(ktx2);
    loader.setMeshoptDecoder(MeshoptDecoder);
    loader.load(props.src, function(gltf){
      var root = gltf.scene;
      root.traverse(function(o){
        if (o.isMesh && o.morphTargetDictionary && o.morphTargetInfluences){
          head = o; dict = o.morphTargetDictionary; infl = o.morphTargetInfluences;
        }
        if (o.isMesh && o.material && "emissive" in o.material){
          o.material.emissive = new THREE.Color(0x0b0d12);
          o.material.emissiveIntensity = 0.25;
        }
      });
      group.add(root);

      var box = new THREE.Box3().setFromObject(root);
      var size = new THREE.Vector3(); box.getSize(size);
      var center = new THREE.Vector3(); box.getCenter(center);
      root.position.sub(center);
      root.position.y -= size.y * (0.5 - (props.fy != null ? props.fy : .16));

      var fitDist = (size.y * 0.56) / Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
      camera.position.set(0, size.y*0.1, fitDist * (props.zoom ? 1/props.zoom : 1.1));
      camera.lookAt(0, size.y*0.1, 0);

      stop = gate(cv, draw);
    }, undefined, function(err){ console.error("NEXUS character load failed", err); });

    function setMorph(name, v){
      if (dict && (name in dict)) infl[dict[name]] = v;
    }

    function draw(now){
      var t = (now-t0)/1000;
      if (!head){ renderer.render(scene, camera); return; }
      talkEnergy += ((talking?1:0) - talkEnergy) * 0.1;
      wordKick *= 0.86;

      if (!reduceMotion && t > blinkAt) blinkAt = t + 2.6 + Math.random()*3.4;
      var blinkPhase = reduceMotion ? 0 : Math.max(0, 1 - Math.abs(t-blinkAt+0.08)/0.08);
      setMorph("eyeBlink_L", blinkPhase);
      setMorph("eyeBlink_R", blinkPhase);

      var mouthEnergy = Math.min(1, talkEnergy*0.8 + wordKick*0.9);
      var jaw = mouthEnergy * (0.3 + 0.18*Math.sin(t*9.4)) + wordKick*0.18;
      setMorph("jawOpen", Math.max(0, Math.min(0.5, jaw)));
      setMorph("mouthFunnel", mouthEnergy*0.1*Math.max(0, Math.sin(t*7.1)));
      setMorph("browInnerUp", mouthEnergy*0.08);

      group.rotation.y = reduceMotion ? 0 : Math.sin(t*0.3)*0.1 + mouse.x*0.16;
      group.rotation.x = reduceMotion ? 0 : Math.sin(t*0.22+1.1)*0.025 + mouse.y*0.06;
      group.position.y = reduceMotion ? 0 : Math.sin(t*1.1)*0.008;

      renderer.render(scene, camera);
    }

    cv.addEventListener("pointermove", function(ev){
      var r = cv.getBoundingClientRect();
      mouse.x = ((ev.clientX-r.left)/r.width - 0.5) * 2;
      mouse.y = ((ev.clientY-r.top)/r.height - 0.5) * -2;
    });
    cv.addEventListener("pointerleave", function(){ mouse.x = 0; mouse.y = 0; });

    return {
      setTalking: function(v){ talking = !!v; },
      pulseWord: function(){ wordKick = 1; }
    };
  }

  var character = initCharacter(document.getElementById("char-canvas"), { w:640, h:800, zoom:1.1, fy:.42, src:"assets/facecap.glb" });

  // ---------- talk bar: preview-only acknowledgment + TTS ----------
  var input = document.getElementById("input-text");
  var toast = document.getElementById("toast");
  var chipStatus = document.getElementById("chip-status");
  var micBtn = document.getElementById("btn-mic");
  var listening = false;
  var toastTimer = null;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 3200);
  }

  var idVoice = null;
  function pickIdVoice(){
    var vs = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    idVoice = vs.find(function(v){ return /^id/i.test(v.lang) || /Damayanti/i.test(v.name); }) || null;
  }
  if (window.speechSynthesis){ pickIdVoice(); window.speechSynthesis.onvoiceschanged = pickIdVoice; }

  function respond(text){
    chipStatus.textContent = "MENGERJAKAN";
    showToast("Oke, saya kerjakan di background — buka PROSES untuk lihat progress.");
    if (window.speechSynthesis){
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance("Oke, saya kerjakan.");
      u.lang = "id-ID"; if (idVoice) u.voice = idVoice; u.rate = 1.0;
      u.onstart = function(){ character.setTalking(true); };
      u.onend = function(){ character.setTalking(false); chipStatus.textContent = "SIAP"; };
      u.onboundary = function(){ character.pulseWord(); };
      window.speechSynthesis.speak(u);
    } else {
      setTimeout(function(){ chipStatus.textContent = "SIAP"; }, 1200);
    }
    input.value = "";
  }

  document.getElementById("btn-send").addEventListener("click", function(){
    if (input.value.trim()) respond(input.value.trim());
  });
  input.addEventListener("keydown", function(ev){
    if (ev.key === "Enter" && input.value.trim()) respond(input.value.trim());
  });

  var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (Recognition){
    var rec = new Recognition();
    rec.lang = "id-ID"; rec.interimResults = false;
    rec.onresult = function(ev){
      var text = ev.results[0][0].transcript;
      input.value = text;
      respond(text);
    };
    rec.onend = function(){ listening = false; micBtn.classList.remove("listening"); };
    micBtn.addEventListener("click", function(){
      if (listening){ rec.stop(); return; }
      listening = true; micBtn.classList.add("listening");
      rec.start();
    });
  } else {
    micBtn.style.opacity = .35;
    micBtn.addEventListener("click", function(){ showToast("Browser ini tidak mendukung input suara."); });
  }

  document.getElementById("nav-proses").addEventListener("click", function(){
    showToast("Halaman Proses belum dibangun di preview ini.");
  });
  document.getElementById("nav-tentang").addEventListener("click", function(){
    showToast("NEXUS — konsol agent kerja pribadi. (placeholder)");
  });
  document.getElementById("nav-pengaturan").addEventListener("click", function(){
    showToast("Pengaturan belum dibangun di preview ini.");
  });
})();
</script>
</body>
</html>
